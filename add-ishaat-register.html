<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>روانگی ڈاک اندراج - وکالت اشاعت</title>
    
    <!-- Bootstrap 4 RTL CSS -->
    <link rel="stylesheet" href="https://cdn.rtlcss.com/bootstrap/v4.5.3/css/bootstrap.min.css">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Jameel Noori Nastaleeq Font -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Common Navbar CSS -->
    <link rel="stylesheet" href="css/navbar.css">
    
    <style>
        body {
            font-family: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            direction: rtl;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        
        /* Main Content */
        .main-content {
            flex: 1;
            padding: 30px 0;
        }
        
        .content-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px;
            margin: 20px auto;
            max-width: 1000px;
        }
        
        .page-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .page-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin: 0;
        }
        
        .form-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 30px;
            border: 2px solid #e9ecef;
        }
        
        .form-section h4 {
            color: #495057;
            margin-bottom: 25px;
            font-weight: bold;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .form-control {
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            text-align: right;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        
        .form-label {
            font-weight: bold;
            color: #495057;
            margin-bottom: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
            border: none;
            border-radius: 8px;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(108, 117, 125, 0.4);
        }
        
        /* Footer Styles */
        .footer {
            background: linear-gradient(135deg, #495057 0%, #343a40 100%);
            color: white;
            padding: 40px 0 20px;
            margin-top: 50px;
        }
        
        .footer-bottom {
            border-top: 1px solid #495057;
            padding-top: 20px;
            margin-top: 30px;
            text-align: center;
            color: #adb5bd;
        }
        
        @media (max-width: 768px) {
            .content-container {
                margin: 10px;
                padding: 20px;
            }
            
            .form-section {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="content-container">
                <!-- Page Header -->
                <div class="page-header">
                    <h1 class="page-title">
                        <i class="fas fa-plus-circle ml-2"></i>
                        روانگی ڈاک اندراج
                    </h1>
                </div>

                <!-- Form Section -->
                <div class="form-section">
                    <h4>
                        <i class="fas fa-edit ml-2"></i>
                        انٹری کی تفصیلات
                    </h4>
                    
                    <form id="ishaat-register-form" novalidate>
                        <div class="row">
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label for="serialNumber" class="form-label">روانگی نمبر</label>
                                    <input type="text" class="form-control" id="serialNumber" name="serialNumber" required>
                                    <div class="invalid-feedback">
                                        براہ کرم روانگی نمبر درج کریں
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label for="date" class="form-label">تاریخ</label>
                                    <input type="date" class="form-control" id="date" name="date" required>
                                    <div class="invalid-feedback">
                                        براہ کرم تاریخ منتخب کریں
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label for="name" class="form-label">بنام</label>
                                    <input type="text" class="form-control" id="name" name="name" required>
                                    <div class="invalid-feedback">
                                        براہ کرم بنام درج کریں
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Buttons -->
                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-primary btn-lg ml-3">
                                <i class="fas fa-save ml-2"></i>
                                محفوظ کریں
                            </button>
                            <button type="reset" class="btn btn-secondary btn-lg">
                                <i class="fas fa-undo ml-2"></i>
                                صاف کریں
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2025 وکالت اشاعت</p>
            </div>
        </div>
    </footer>

    <!-- Bootstrap 4 JS -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->
    <script>
        $(document).ready(function() {
            // Auto-generate serial number
            function generateSerialNumber() {
                let existingEntries = JSON.parse(localStorage.getItem('ishaatRegisterEntries') || '[]');
                let nextSerial = existingEntries.length + 1;
                return nextSerial.toString().padStart(3, '0');
            }

            // Set auto serial number on page load
            $('#serialNumber').val(generateSerialNumber());

            // Form validation and submission
            $('#ishaat-register-form').on('submit', function(e) {
                e.preventDefault();
                
                const form = this;
                let isValid = true;
                
                // Reset all validation states
                $('.form-control').removeClass('is-invalid is-valid');
                
                // Validate serial number
                const serialNumber = $('#serialNumber').val().trim();
                if (!serialNumber) {
                    $('#serialNumber').addClass('is-invalid');
                    isValid = false;
                } else {
                    $('#serialNumber').addClass('is-valid');
                }
                
                // Validate date
                const date = $('#date').val();
                if (!date) {
                    $('#date').addClass('is-invalid');
                    isValid = false;
                } else {
                    $('#date').addClass('is-valid');
                }
                
                // Validate name
                const name = $('#name').val().trim();
                if (!name) {
                    $('#name').addClass('is-invalid');
                    isValid = false;
                } else {
                    $('#name').addClass('is-valid');
                }
                
                if (isValid) {
                    // Get existing entries from localStorage
                    let existingEntries = JSON.parse(localStorage.getItem('ishaatRegisterEntries') || '[]');
                    
                    // Add new entry
                    const newEntry = {
                        serialNumber: serialNumber,
                        date: date,
                        name: name,
                        timestamp: new Date().toISOString()
                    };
                    
                    existingEntries.push(newEntry);
                    
                    // Save to localStorage
                    localStorage.setItem('ishaatRegisterEntries', JSON.stringify(existingEntries));
                    
                    // Show success message
                    alert('انٹری کامیابی سے شامل کی گئی!');
                    
                    // Reset form
                    form.reset();
                    $('.form-control').removeClass('is-valid is-invalid');
                    
                    // Generate new serial number
                    $('#serialNumber').val(generateSerialNumber());
                }
            });
            
            // Remove validation classes on input
            $('.form-control').on('input change', function() {
                $(this).removeClass('is-invalid is-valid');
            });
        });
    </script>
    
    <!-- Common Navbar JS -->
    <script src="js/navbar.js"></script>
    <script>
        loadNavbar('add-ishaat-register');
    </script>
</body>
</html>

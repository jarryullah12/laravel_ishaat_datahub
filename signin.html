<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Ishaat DataHub</title>
    
    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Jameel Noori Nastaleeq Font -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Common Navbar CSS -->
    <link rel="stylesheet" href="css/navbar.css">
    
    <!-- Custom CSS -->
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', serif;
        }
        
        .signin-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        
        .signin-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        
        .signin-header h2 {
            margin: 0;
            font-weight: 400;
            font-family: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', serif;
            font-size: 2rem;
        }
        
        .signin-header p {
            margin: 0.5rem 0 0 0;
            opacity: 0.9;
        }
        
        .signin-form {
            padding: 2.5rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-label {
            text-align: right;
            direction: rtl;
            display: block;
            margin-bottom: 0.5rem;
        }
        
        .form-control {
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        
        .input-group-text {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-right: none;
            border-radius: 10px 0 0 10px;
            color: #6c757d;
        }
        
        .input-group .form-control {
            border-left: none;
            border-radius: 0 10px 10px 0;
        }
        
        .input-group:focus-within .input-group-text {
            border-color: #667eea;
            background: #e7f0ff;
        }
        
        .btn-signin {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 0.75rem 2rem;
            font-size: 1.1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            width: 100%;
        }
        
        .btn-signin:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .forgot-password {
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }
        
        .forgot-password:hover {
            color: #764ba2;
            text-decoration: none;
        }
        
        
        @media (max-width: 576px) {
            .signin-form {
                padding: 1.5rem;
            }
            
            .signin-header {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="signin-container">
                    <!-- Header -->
                    <div class="signin-header">
                        <h2>وکالت اشاعت</h2>
                    </div>
                    
                    <!-- Sign In Form -->
                    <div class="signin-form">
                        <form id="signinForm" novalidate>
                            <!-- Email Input -->
                            <div class="form-group">
                                <label for="email" class="form-label">ای میل پتہ</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text">
                                            <i class="fas fa-envelope"></i>
                                        </span>
                                    </div>
                                    <input type="email" class="form-control" id="email" name="email" 
                                           placeholder="اپنا ای میل درج کریں" required>
                                </div>
                                <div class="invalid-feedback">
                                    براہ کرم صحیح ای میل پتہ درج کریں۔
                                </div>
                            </div>
                            
                            <!-- Password Input -->
                            <div class="form-group">
                                <label for="password" class="form-label">پاس ورڈ</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text">
                                            <i class="fas fa-lock"></i>
                                        </span>
                                    </div>
                                    <input type="password" class="form-control" id="password" name="password" 
                                           placeholder="اپنا پاس ورڈ درج کریں" required>
                                    <div class="input-group-append">
                                        <span class="input-group-text" id="togglePassword" style="cursor: pointer;">
                                            <i class="fas fa-eye" id="eyeIcon"></i>
                                        </span>
                                    </div>
                                </div>
                                <div class="invalid-feedback">
                                    پاس ورڈ کم از کم 6 حروف کا ہونا چاہیے۔
                                </div>
                            </div>
                            
                            <!-- Remember Me & Forgot Password -->
                           
                            <!-- Sign In Button -->
                            <button type="submit" class="btn btn-primary btn-signin">
                                <i class="fas fa-sign-in-alt me-2"></i> سائن ان 
                            </button>
                            
                            <!-- Signup Link -->
                            <div class="text-center mt-3">
                                <p class="mb-0">اکاؤنٹ نہیں ہے؟ <a href="signup.html" class="forgot-password">یہاں رجسٹر کریں</a></p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap 4 JS -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JavaScript -->
    <script>
        $(document).ready(function() {
            // Toggle password visibility
            $('#togglePassword').click(function() {
                const passwordField = $('#password');
                const eyeIcon = $('#eyeIcon');
                
                if (passwordField.attr('type') === 'password') {
                    passwordField.attr('type', 'text');
                    eyeIcon.removeClass('fa-eye').addClass('fa-eye-slash');
                } else {
                    passwordField.attr('type', 'password');
                    eyeIcon.removeClass('fa-eye-slash').addClass('fa-eye');
                }
            });
            
            // Form validation
            $('#signinForm').submit(function(e) {
                e.preventDefault();
                
                let isValid = true;
                const form = this;
                
                // Email validation
                const email = $('#email').val();
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                
                if (!email || !emailRegex.test(email)) {
                    $('#email').addClass('is-invalid');
                    isValid = false;
                } else {
                    $('#email').removeClass('is-invalid').addClass('is-valid');
                }
                
                // Password validation
                const password = $('#password').val();
                if (!password || password.length < 6) {
                    $('#password').addClass('is-invalid');
                    isValid = false;
                } else {
                    $('#password').removeClass('is-invalid').addClass('is-valid');
                }
                
                if (isValid) {
                    // Here you would typically send the data to your server
                    alert('ساین ان فارم کامیابی سے جمع ہوا!\nای میل: ' + email);
                    
                    // Reset form
                    form.reset();
                    $('.form-control').removeClass('is-valid is-invalid');
                }
            });
            
            // Remove validation classes on input
            $('.form-control').on('input', function() {
                $(this).removeClass('is-invalid is-valid');
            });
            
            
            // Forgot password handler
            $('.forgot-password').click(function(e) {
                const href = $(this).attr('href');
                if (href === 'signup.html') {
                    // Allow signup link to redirect normally
                    return true;
                } else {
                    // For forgot password link, show alert
                    e.preventDefault();
                    alert('پاس ورڈ ری سیٹ کرنے کے صفحے پر جائیں');
                }
            });
        });
    </script>
</body>
</html>
